<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Магазин{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 15px; }
        a { margin-right: 10px; }
        input, textarea, select { display: block; width: 100%; max-width: 500px; padding: 8px; margin: 6px 0 14px; }
        button { padding: 7px 14px; cursor: pointer; }
        .item { border-bottom: 1px solid #ccc; padding: 12px 0; }
        img { max-width: 220px; display: block; margin: 10px 0; }
        .errorlist { color: darkred; }
    </style>
</head>
<body>
    <h1><a href="{% url 'products' %}">Магазин</a></h1>
    <p><a href="{% url 'products' %}">Товары</a> <a href="{% url 'categories' %}">Категории</a></p>
    {% block content %}{% endblock %}
</body>
</html>
